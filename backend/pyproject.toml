[tool.poetry]
name = "ai-platform-backend"
version = "1.0.0"
description = "AI Platform Backend with Agent Orchestration"
authors = ["AI Platform Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
sqlalchemy = "^2.0.25"
alembic = "^1.13.1"
psycopg2-binary = "^2.9.9"
redis = "^5.0.1"
celery = "^5.3.6"
anthropic = "^0.18.1"
openai = "^1.10.0"
httpx = "^0.26.0"
websockets = "^12.0"
python-multipart = "^0.0.6"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-dotenv = "^1.0.1"
jinja2 = "^3.1.3"
aiofiles = "^23.2.1"
pyyaml = "^6.0.1"
docker = "^7.0.0"
kubernetes = "^29.0.0"
asyncpg = "^0.29.0"
motor = "^3.3.2"
pymongo = "^4.6.1"
minio = "^7.2.3"
aioboto3 = "^12.3.0"
prometheus-client = "^0.19.0"
sentry-sdk = "^1.40.0"
loguru = "^0.7.2"
tenacity = "^8.2.3"
langchain = "^0.1.4"
langchain-anthropic = "^0.1.1"
chromadb = "^0.4.22"
tiktoken = "^0.5.2"
beautifulsoup4 = "^4.12.3"
playwright = "^1.41.2"
aiohttp = "^3.9.3"
websocket-client = "^1.7.0"
jsonschema = "^4.21.1"
networkx = "^3.2.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
